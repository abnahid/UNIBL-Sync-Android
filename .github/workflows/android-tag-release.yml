name: Android tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject approved Firebase client config when provided
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test debug APK
        shell: bash
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare versioned APK filename
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/unibl-sync-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish debug APK release
        uses: softprops/action-gh-release@v2
        with:
          name: UNIBL Sync ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/unibl-sync-${{ github.ref_name }}-debug.apk
